    <script>

        const apiUrl = 'http://127.0.0.1:5000/api/hello';
        // ====== async await ======
        // 步驟1 找到要控制的標籤   
        const btnStart = document.querySelector('#buttonStart');
        const btnEnd = document.querySelector('#buttonEnd');
        const div1 = document.querySelector('#divInfo');
        const imgLoading = document.querySelector('#img1');


        let abortController; //宣告變數

        btnEnd.addEventListener('click', () => {
            if (abortController) {
                abortController.abort(); //停止api呼叫
            }

        })


        // 步驟2 何時做 -> 事件 (click 按下按鈕)
        btnStart.addEventListener('click', async () => {
            //步驟3 呼叫api -> 要做甚麼
            try {
                //建立abortController 物件
                abortController = new AbortController();
                const signal = abortController.signal;

                imgLoading.style.display = 'inline'; //顯示執行中圖示 (按下按鈕)
                btnStart.disabled = true; //停用按鈕功能 

                const response = await fetch(apiUrl, { signal }); //response物件 => header + body  {'signal':signal} => {'key': value}
                if (!response.ok) throw new Error('API 呼叫錯誤')

                const data = await response.json();
                div1.innerHTML = `<h2>${data.message}</h2>`

            } catch (error) {
                let message = error.message;
                if (error.name === 'AbortError') {
                    message = "你停止了程式的執行"
                }

                div1.innerHTML = `錯誤訊息: ${message}`

            } finally {
                imgLoading.style.display = 'none';
                btnStart.disabled = false;
            }
        })

        function printSomething(data) {
